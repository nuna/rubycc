# Tier B: the weekly jobs that are too slow or too network-hungry to run on
# every push. None of them is part of `rake test`. See docs/development/CI.md.
name: weekly

# Quoted so YAML parsers cannot read the key as the boolean `on`.
"on":
  schedule:
    # Every Sunday 18:00 UTC = Monday 03:00 JST.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      verify_step:
        description: >-
          Step number for the musl job's gem verification. Set it to record the
          musl results into data/verified_gems.json (downloadable as the
          weekly-musl artifact); leave it empty for a read-only regression run,
          which is what the weekly schedule does.
        required: false
        default: ""
      only:
        description: >-
          Run just one job instead of the whole weekly set. The native aarch64
          suite and aarch64 ABI measurement are reachable without paying for
          the other six jobs' minutes.
        required: false
        default: ""
        type: choice
        options: ["", "acceptance", "aarch64", "musl-aarch64"]

permissions:
  contents: read

jobs:
  # A malformed manual dispatch must fail explicitly. Without this guard,
  # combining verify_step with an only=... selector would make every workload
  # job skip and could look like a successful run with no product signal.
  dispatch-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate manual input combination
        shell: bash
        env:
          VERIFY_STEP: ${{ inputs.verify_step }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [[ -n "$VERIFY_STEP" && -n "$ONLY" ]]; then
            echo "verify_step and only cannot be combined" >&2
            exit 1
          fi

  # Regenerates the committed corpus #include census and fails when it moved.
  # The gem versions are pinned in test/corpus/gems.rb, so a diff cannot come
  # from upstream drift: it means rubycc's own header coverage changed, which is
  # information worth committing.
  census:
    # A dispatch that sets verify_step is a musl *recording* run (docs/development/CI.md):
    # only the musl job has anything to do, and the free-tier minute budget
    # is tight enough that dragging the other six along would cost more than
    # the run itself. Everything else is unchanged for the weekly schedule.
    if: inputs.verify_step == '' && inputs.only == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A (.github/workflows/test.yml); qemu-user rather than
        # qemu-user-static because the tests look for a command named
        # `qemu-aarch64`. GitHub Actions does not support YAML anchors, so the
        # list is repeated in each job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          # A single version: the weekly jobs check behaviour, not version
          # coverage (that is Tier A's matrix).
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Regenerate the census
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake corpus:census 2>&1 | tee tmp/ci/census.log

      - name: Fail when the committed snapshot is out of date
        shell: bash
        run: |
          if ! git diff --exit-code -- test/corpus/include-census.md; then
            echo "::error::test/corpus/include-census.md changed; review the diff above and commit the regenerated snapshot"
            exit 1
          fi
          echo "census snapshot unchanged"

      - name: Upload the regenerated census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-census
          path: |
            test/corpus/include-census.md
            tmp/ci/*.log
          if-no-files-found: warn

  # The opt-in acceptance work: the networked tests behind RMAKE_ACCEPTANCE=1
  # plus the M2 acceptance tool (build json/msgpack with rubycc and run their own
  # test suites).
  acceptance-fixture:
    # This is the deterministic acceptance contract. It runs on every scheduled
    # weekly invocation and on an acceptance-only dispatch, independently of
    # rubygems.org. It is the required product signal when the live network is
    # unavailable.
    if: inputs.verify_step == '' && (inputs.only == '' || inputs.only == 'acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install the local fixture toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run deterministic mkmf and rmake fixtures
        shell: bash
        env:
          CI_PROFILE: acceptance-fixture
          CI_RESULT_PATH: tmp/ci/acceptance-fixture-results.json
          CI_NETWORK: fixture
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          set +e
          bundle exec ruby -Ilib:test test/test_mkmf_conftest.rb \
            --name test_conftest_probe_api_matches_gcc_truth --verbose \
            2>&1 | tee tmp/ci/acceptance-fixture-mkmf.log
          mkmf_status=${PIPESTATUS[0]}
          bundle exec ruby -Ilib:test test/test_rmake_tools.rb \
            --name test_tools_substitution_builds_loadable_so_sequential --verbose \
            2>&1 | tee tmp/ci/acceptance-fixture-rmake.log
          rmake_status=${PIPESTATUS[0]}
          if [ "$mkmf_status" -ne 0 ] || [ "$rmake_status" -ne 0 ]; then
            exit 1
          fi

      - name: Check required fixture results
        if: always()
        run: |
          ruby tools/ci_check_acceptance.rb \
            --manifest config/ci/acceptance_manifest.json \
            --results tmp/ci/acceptance-fixture-results.json \
            --profile acceptance-fixture \
            --strict

      - name: Upload deterministic acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-acceptance-fixture
          path: |
            tmp/ci/acceptance-fixture-*.log
            tmp/ci/acceptance-fixture-results.json
          if-no-files-found: warn

  acceptance:
    # An acceptance-only dispatch runs this live job together with the
    # deterministic fixture, while skipping the unrelated weekly jobs.
    if: inputs.verify_step == '' && (inputs.only == '' || inputs.only == 'acceptance')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: Run live acceptance preflight
        shell: bash
        env:
          RMAKE_ACCEPTANCE_STRICT: "1"
          CI_PROFILE: acceptance-live
          CI_RESULT_PATH: tmp/ci/acceptance-results.json
          CI_ARTIFACT_REPORT_PATH: tmp/ci/acceptance-artifacts.json
          CI_NETWORK: live
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          ruby tools/live_acceptance_preflight.rb 2>&1 | tee tmp/ci/acceptance-preflight.log

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run the suite with the networked acceptance tests enabled
        shell: bash
        env:
          RMAKE_ACCEPTANCE: "1"
          RMAKE_ACCEPTANCE_STRICT: "1"
          CI_PROFILE: acceptance-live
          CI_RESULT_PATH: tmp/ci/acceptance-results.json
          CI_ARTIFACT_REPORT_PATH: tmp/ci/acceptance-artifacts.json
          CI_NETWORK: live
          GEM_SPEC_CACHE: ${{ runner.temp }}/gem-spec-cache
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake test TESTOPTS="--verbose" 2>&1 | tee tmp/ci/acceptance-suite.log

      - name: Run the M2 acceptance tool
        if: always()
        shell: bash
        env:
          CI_PROFILE: acceptance-live
          CI_RESULT_PATH: tmp/ci/acceptance-results.json
          CI_ARTIFACT_REPORT_PATH: tmp/ci/acceptance-artifacts.json
          CI_NETWORK: live
          M2_VARIADIC_REPORT: tmp/ci/m2-variadics.json
          GEM_SPEC_CACHE: ${{ runner.temp }}/gem-spec-cache
          GEM_HOME: ${{ runner.temp }}/m2-gem-home
          GEM_PATH: ${{ runner.temp }}/m2-gem-home
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          ruby tools/m2_acceptance.rb "$RUNNER_TEMP/m2" 2>&1 | tee tmp/ci/m2-acceptance.log

      - name: Check required live acceptance results
        if: always()
        run: |
          ruby tools/ci_check_acceptance.rb \
            --manifest config/ci/acceptance_manifest.json \
            --results tmp/ci/acceptance-results.json \
            --profile acceptance-live \
            --artifacts tmp/ci/acceptance-artifacts.json \
            --strict
        # No tools/ci_check_skips.rb here: enabling acceptance changes the
        # suite's run/skip shape. The structured checker instead verifies that
        # every required ID ran, that no fetch failure became a skip, and that
        # M2 reported both gem suites.

      - name: Upload the acceptance logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-acceptance-logs
          path: |
            tmp/ci/*.log
            tmp/ci/acceptance-results.json
            tmp/ci/acceptance-artifacts.json
            tmp/ci/m2-variadics.json
          if-no-files-found: warn

  # Throughput (requirement N1) as a trend line only.
  throughput:
    # A dispatch that sets verify_step is a musl *recording* run (docs/development/CI.md):
    # only the musl job has anything to do, and the free-tier minute budget
    # is tight enough that dragging the other six along would cost more than
    # the run itself. Everything else is unchanged for the weekly schedule.
    if: inputs.verify_step == '' && inputs.only == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Measure compile throughput
        # Deliberately no pass/fail threshold on the numbers. Hosted runners are
        # shared and their throughput drifts far more than the differences these
        # measurements are meant to detect; docs/development/THROUGHPUT.md records that a
        # performance verdict is only meaningful from a paired HEAD -> change
        # measurement on one machine in one session. This job exists to keep the
        # harness itself exercised and to leave a trend artifact.
        shell: bash
        env:
          BENCH_RUNS: "7"
          BENCH_WORK: ${{ runner.temp }}/bench
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake bench:throughput 2>&1 | tee tmp/ci/throughput.log

      - name: Upload the throughput results
        # Artifact only -- the results are never committed. Numbers from a
        # hosted runner would pollute the measurement record in
        # benchmark/results/, which docs/development/THROUGHPUT.md reads as same-machine data.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-throughput
          path: |
            benchmark/results/
            tmp/ci/*.log
          if-no-files-found: warn

  # M5 claims glibc/musl compatible headers, but every measurement behind that
  # claim -- the ABI harness, the corpus, all eighteen entries in
  # data/verified_gems.json -- was taken on glibc. This job is the other half:
  # the same suite and the same gem-install procedure on musl, with a musl gcc
  # as the reference implementation the differential tests compare against.
  #
  # It runs the container itself rather than using `container:` on purpose. The
  # runner injects its own glibc-linked node into a job container, which an
  # Alpine image cannot execute, so every `uses:` step in such a job has to be
  # worked around. Checking out on the host and bind-mounting the checkout into
  # `docker run` keeps the actions on glibc and puts only rubycc on musl, which
  # is the thing being measured.
  musl:
    # A verify_step dispatch is this job's own recording run, so unlike the
    # other six it stays on for that; an `only` dispatch naming a different
    # job skips it.
    if: inputs.only == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # ruby:4.0-alpine matches the Ruby version the other weekly jobs use, so a
      # difference this job reports is a libc difference and not a version one.
      - name: Run the suite and the gem verification on musl
        env:
          VERIFY_STEP: ${{ inputs.verify_step }}
        run: |
          docker run --rm \
            -v "$PWD":/w -w /w \
            -e VERIFY_STEP \
            ruby:4.0-alpine sh /w/.github/scripts/musl-suite.sh
        # No tools/ci_check_skips.rb here, and for a different reason than the
        # acceptance job's: Alpine packages no aarch64-linux-musl cross
        # toolchain, so every aarch64 differential test skips. The Tier A skip
        # thresholds would fire on that alone and say nothing about musl. The
        # x86_64 half is what this job is for; failures still fail it through
        # the script's exit status.

      - name: Upload the musl logs and any recorded verifications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-musl
          path: |
            tmp/ci/*.log
            tmp/ci/extensions/**
            data/verified_gems.json
          if-no-files-found: warn

  # The other half of the musl question: the machine. Every musl measurement so
  # far -- Step 193's divergence columns, everything the job above reports -- was
  # taken on x86-64, so the bundled headers' aarch64 layer
  # (include/libc/glibc/aarch64/) still carries glibc values only, each file
  # saying in its own comment that it stays that way until an aarch64 musl run
  # measures it. This job is that run: an arm64 container under qemu, with the
  # container's musl gcc as the oracle.
  #
  # It runs only the two files that probe header ABI, not the suite. Under qemu
  # emulation the suite is hours of runner time to re-measure what the x86-64
  # musl job and the aarch64 cross job already cover; the ABI values are the one
  # thing no other job can reach. It is also expected to fail until those values
  # are transcribed, and that is the point -- the differences in the uploaded
  # logs are the measurement, so the artifact is unconditional and the exit
  # status is left honest rather than swallowed by continue-on-error.
  #
  # Same container structure as the job above (checkout on the host, bind-mount
  # into `docker run`) and for the same reason: the runner's injected node
  # cannot execute on Alpine, so the actions stay on glibc/x86-64 and only
  # rubycc runs on musl/aarch64.
  musl-aarch64:
    # A dispatch that sets verify_step is a musl *recording* run (docs/development/CI.md),
    # and this job records nothing: it writes no verified_gems.json entry and
    # its logs are read by hand. Emulated minutes are the most expensive kind on
    # the free tier, so a recording dispatch does not pay for them. It is also
    # the one job `only` can select by name, because it is the one whose
    # answer is worth a dispatch of its own.
    if: inputs.verify_step == '' && (inputs.only == '' || inputs.only == 'musl-aarch64')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Registers the binfmt_misc handlers that let the x86-64 runner execute
      # an arm64 image; without it `docker run --platform linux/arm64` fails on
      # the first instruction of the container's entry point.
      - uses: docker/setup-qemu-action@v3

      # ruby:4.0-alpine has an arm64 image, so the Ruby version and the libc
      # match the musl job above and only the machine differs -- which is what
      # makes a difference this job reports an aarch64 one.
      - name: Measure the header ABI on aarch64 musl
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/w -w /w \
            ruby:4.0-alpine sh /w/.github/scripts/musl-aarch64-abi.sh

      - name: Upload the aarch64 musl measurement logs
        # The whole deliverable of the job, and the reason for `always()`: the
        # run this is written for is a failing one, and its logs are the
        # measurement the header values come from.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-musl-aarch64
          path: tmp/ci/*.log
          if-no-files-found: warn

  # Native aarch64 is a manual-only M4 acceptance. Reuse Tier A's full-suite
  # workflow so toolchain setup, Ruby matrix, skip guard and artifact handling
  # cannot drift between the two paths. It is not part of the weekly schedule
  # because two native ARM matrix jobs would consume a large share of the free
  # Actions budget.
  aarch64:
    if: inputs.verify_step == '' && inputs.only == 'aarch64'
    uses: ./.github/workflows/test.yml
    with:
      runner: ubuntu-24.04-arm
      artifact_prefix: weekly-aarch64-test-log
      concurrency_group: weekly-aarch64-${{ github.ref }}

  # A small native-only profile makes the native guarantee visible without
  # making the full-suite result the only evidence. The full native suite above
  # remains available for manual acceptance; this smoke is the focused contract
  # for Ruby/loader/libc/Fiddle and representative AArch64 ABI behaviour.
  #
  # It runs on the weekly schedule, unlike the full native suite above. Every
  # native mechanism in this repository -- the preflight, the native-aarch64
  # skip baseline, test.yml's architecture assertion -- only reports anything on
  # an AArch64 runner. Gating all of them behind `only: aarch64` means the
  # scheduled run re-checks nothing native, so the guarantee is only as fresh as
  # the last time somebody remembered to dispatch. This is the cheap half of the
  # pair: a 20-minute ceiling on one arm runner, against the full suite's two
  # Rubies, so the schedule can carry it.
  native-aarch64-smoke:
    if: inputs.verify_step == '' && (inputs.only == '' || inputs.only == 'aarch64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Initialize native smoke artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/ci
          : > tmp/ci/native-aarch64-results.json
          : > tmp/ci/native-aarch64-context.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: Run native AArch64 preflight
        shell: bash
        env:
          CI_PROFILE: native-aarch64-smoke
          CI_RESULT_PATH: tmp/ci/native-aarch64-results.json
          CI_NATIVE_CONTEXT_PATH: tmp/ci/native-aarch64-context.json
          CI_HOST: aarch64
          CI_TARGET: aarch64
          CI_RUNNER: native-aarch64
          CI_LIBC: glibc
          CI_NETWORK: none
        run: |
          set -euo pipefail
          ruby tools/native_aarch64_preflight.rb | tee tmp/ci/native-aarch64-preflight.log

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run the native AArch64 smoke
        shell: bash
        env:
          NATIVE_AARCH64_REQUIRED: "1"
          CI_PROFILE: native-aarch64-smoke
          CI_RESULT_PATH: tmp/ci/native-aarch64-results.json
          CI_HOST: aarch64
          CI_TARGET: aarch64
          CI_RUNNER: native-aarch64
          CI_LIBC: glibc
          CI_NETWORK: none
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec ruby -Ilib:test test/test_native_aarch64_smoke.rb --verbose 2>&1 | tee tmp/ci/native-aarch64-smoke.log

      - name: Check required native smoke results
        if: always()
        run: |
          ruby tools/ci_check_acceptance.rb \
            --manifest config/ci/acceptance_manifest.json \
            --results tmp/ci/native-aarch64-results.json \
            --profile native-aarch64-smoke \
            --strict

      - name: Upload the native smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-native-aarch64-smoke
          path: |
            tmp/ci/native-aarch64-smoke.log
            tmp/ci/native-aarch64-preflight.log
            tmp/ci/native-aarch64-context.json
            tmp/ci/native-aarch64-results.json
          if-no-files-found: error

  # The intermediate version 3.4 is checked weekly rather than on every push,
  # to save runner minutes. The two ends (3.3 and 4.0) are checked on every
  # push by test.yml, so a version-specific break is caught within the week
  # unless it is 3.4-specific.
  ruby-3-4:
    # A dispatch that sets verify_step is a musl *recording* run (docs/development/CI.md):
    # only the musl job has anything to do, and the free-tier minute budget
    # is tight enough that dragging the other six along would cost more than
    # the run itself. Everything else is unchanged for the weekly schedule.
    if: inputs.verify_step == '' && inputs.only == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - name: Verify the toolchain is complete
        # Fail here rather than later: a missing tool turns hundreds of tests
        # into skips, and a skip is silently green. Failing at install time
        # names the problem directly. tools/ci_check_skips.rb is the second net.
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-objdump --version
          qemu-aarch64 --version
          readelf --version
          ar --version
          nm --version
          pkg-config --version
          make --version
          for f in /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
                   /usr/aarch64-linux-gnu/lib/libc.so.6; do
            ls -l "$f"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake test TESTOPTS="--verbose" 2>&1 | tee tmp/ci/test-ruby3.4.log

      - name: Guard against runaway skips
        env:
          CI_SKIP_PROFILE: native-x86
          CI_ENFORCE_SKIP_BASELINE: "1"
        run: ruby tools/ci_check_skips.rb tmp/ci/test-ruby3.4.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-test-log-ruby3.4
          path: tmp/ci/*.log
          if-no-files-found: warn
