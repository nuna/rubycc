# Tier B: the weekly jobs that are too slow or too network-hungry to run on
# every push. None of them is part of `rake test`. See docs/CI.md.
name: weekly

# Quoted so YAML parsers cannot read the key as the boolean `on`.
"on":
  schedule:
    # Every Sunday 18:00 UTC = Monday 03:00 JST.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      verify_step:
        description: >-
          Step number for the musl job's gem verification. Set it to record the
          musl results into data/verified_gems.json (downloadable as the
          weekly-musl artifact); leave it empty for a read-only regression run,
          which is what the weekly schedule does.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Regenerates the committed corpus #include census and fails when it moved.
  # The gem versions are pinned in test/corpus/gems.rb, so a diff cannot come
  # from upstream drift: it means rubycc's own header coverage changed, which is
  # information worth committing.
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A (.github/workflows/test.yml); qemu-user rather than
        # qemu-user-static because the tests look for a command named
        # `qemu-aarch64`. GitHub Actions does not support YAML anchors, so the
        # list is repeated in each job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          # A single version: the weekly jobs check behaviour, not version
          # coverage (that is Tier A's matrix).
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Regenerate the census
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake corpus:census 2>&1 | tee tmp/ci/census.log

      - name: Fail when the committed snapshot is out of date
        shell: bash
        run: |
          if ! git diff --exit-code -- test/corpus/include-census.md; then
            echo "::error::test/corpus/include-census.md changed; review the diff above and commit the regenerated snapshot"
            exit 1
          fi
          echo "census snapshot unchanged"

      - name: Upload the regenerated census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-census
          path: |
            test/corpus/include-census.md
            tmp/ci/*.log
          if-no-files-found: warn

  # The opt-in acceptance work: the networked tests behind RMAKE_ACCEPTANCE=1
  # plus the M2 acceptance tool (build json/msgpack with rubycc and run their own
  # test suites).
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run the suite with the networked acceptance tests enabled
        shell: bash
        env:
          RMAKE_ACCEPTANCE: "1"
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake test TESTOPTS="--verbose" 2>&1 | tee tmp/ci/acceptance-suite.log
        # No tools/ci_check_skips.rb here on purpose: enabling the acceptance
        # tests changes the run's shape (different runs/skips counts), so the
        # Tier A thresholds do not apply. Failures still fail the job through
        # rake's exit status; the log is kept for inspection.

      - name: Run the M2 acceptance tool
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          ruby tools/m2_acceptance.rb "$RUNNER_TEMP/m2" 2>&1 | tee tmp/ci/m2-acceptance.log

      - name: Upload the acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-acceptance-logs
          path: tmp/ci/*.log
          if-no-files-found: warn

  # Throughput (requirement N1) as a trend line only.
  throughput:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Measure compile throughput
        # Deliberately no pass/fail threshold on the numbers. Hosted runners are
        # shared and their throughput drifts far more than the differences these
        # measurements are meant to detect; docs/THROUGHPUT.md records that a
        # performance verdict is only meaningful from a paired HEAD -> change
        # measurement on one machine in one session. This job exists to keep the
        # harness itself exercised and to leave a trend artifact.
        shell: bash
        env:
          BENCH_RUNS: "7"
          BENCH_WORK: ${{ runner.temp }}/bench
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake bench:throughput 2>&1 | tee tmp/ci/throughput.log

      - name: Upload the throughput results
        # Artifact only -- the results are never committed. Numbers from a
        # hosted runner would pollute the measurement record in
        # benchmark/results/, which docs/THROUGHPUT.md reads as same-machine data.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-throughput
          path: |
            benchmark/results/
            tmp/ci/*.log
          if-no-files-found: warn

  # M5 claims glibc/musl compatible headers, but every measurement behind that
  # claim -- the ABI harness, the corpus, all eighteen entries in
  # data/verified_gems.json -- was taken on glibc. This job is the other half:
  # the same suite and the same gem-install procedure on musl, with a musl gcc
  # as the reference implementation the differential tests compare against.
  #
  # It runs the container itself rather than using `container:` on purpose. The
  # runner injects its own glibc-linked node into a job container, which an
  # Alpine image cannot execute, so every `uses:` step in such a job has to be
  # worked around. Checking out on the host and bind-mounting the checkout into
  # `docker run` keeps the actions on glibc and puts only rubycc on musl, which
  # is the thing being measured.
  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ruby:4.0-alpine matches the Ruby version the other weekly jobs use, so a
      # difference this job reports is a libc difference and not a version one.
      - name: Run the suite and the gem verification on musl
        env:
          VERIFY_STEP: ${{ inputs.verify_step }}
        run: |
          docker run --rm \
            -v "$PWD":/w -w /w \
            -e VERIFY_STEP \
            ruby:4.0-alpine /w/.github/scripts/musl-suite.sh
        # No tools/ci_check_skips.rb here, and for a different reason than the
        # acceptance job's: Alpine packages no aarch64-linux-musl cross
        # toolchain, so every aarch64 differential test skips. The Tier A skip
        # thresholds would fire on that alone and say nothing about musl. The
        # x86_64 half is what this job is for; failures still fail it through
        # the script's exit status.

      - name: Upload the musl logs and any recorded verifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-musl
          path: |
            tmp/ci/*.log
            data/verified_gems.json
          if-no-files-found: warn

  # The intermediate version 3.4 is checked weekly rather than on every push,
  # to save runner minutes. The two ends (3.3 and 4.0) are checked on every
  # push by test.yml, so a version-specific break is caught within the week
  # unless it is 3.4-specific.
  ruby-3-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains the differential tests compare against
        # Same set as Tier A; see the comment in the census job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            pkg-config \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            qemu-user

      - name: Verify the toolchain is complete
        # Fail here rather than later: a missing tool turns hundreds of tests
        # into skips, and a skip is silently green. Failing at install time
        # names the problem directly. tools/ci_check_skips.rb is the second net.
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-objdump --version
          qemu-aarch64 --version
          readelf --version
          ar --version
          nm --version
          pkg-config --version
          make --version
          for f in /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
                   /usr/aarch64-linux-gnu/lib/libc.so.6; do
            ls -l "$f"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/ci
          bundle exec rake test TESTOPTS="--verbose" 2>&1 | tee tmp/ci/test-ruby3.4.log

      - name: Guard against runaway skips
        run: ruby tools/ci_check_skips.rb tmp/ci/test-ruby3.4.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-test-log-ruby3.4
          path: tmp/ci/*.log
          if-no-files-found: warn
